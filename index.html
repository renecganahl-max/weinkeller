<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1d3b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121013" media="(prefers-color-scheme: dark)">
<meta name="description" content="Dein Weinkeller fürs Handy: Etikett fotografieren, die KI liest Winzer, Rebsorte und Jahrgang.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weinkeller">
<title>Weinkeller</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="view" class="view" tabindex="-1">
  <noscript><p class="none">Diese App braucht JavaScript.</p></noscript>
</main>
<nav id="tabbar" class="tabbar" aria-label="Hauptmenü"></nav>
<div id="sheets"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="popups" class="popups" aria-live="polite"></div>
<canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
<input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
<input id="file-gallery" type="file" accept="image/*" hidden>
<input id="file-backup" type="file" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
